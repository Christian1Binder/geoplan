name: GeoPlan regression
on:
  pull_request:
  push:
    branches: [main, geoplan-2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node regression tests
        run: |
          for file in tests/*.cjs; do
            if [ "$file" != "tests/browser-v2.cjs" ]; then node "$file" || exit 1; fi
          done
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: node tests/browser-v2.cjs
